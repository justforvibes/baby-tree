<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🌱 Feed the Baby Tree</title>
<style>
/* ══════════════════════════════════════════════
   RESET
══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;width:100vw;height:100vh;font-family:'Segoe UI',sans-serif;touch-action:none}

/* ══════════════════════════════════════════════
   SCENE
══════════════════════════════════════════════ */
#scene{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  transition:background 4s ease;
}

/* ── SKY GRADIENTS ── */
.sky-day    { background:linear-gradient(180deg,#87CEEB 0%,#d4f1f9 45%,#c8e6a0 45%,#7cb846 100%); }
.sky-sunset { background:linear-gradient(180deg,#ff9966 0%,#ffcc88 40%,#d4a06a 45%,#7a9e45 45%,#5a8232 100%); }
.sky-night  { background:linear-gradient(180deg,#0a0a2e 0%,#0d1b4b 40%,#1a3a1a 45%,#0d2200 100%); }

/* ── SUN ── */
#sun{
  position:absolute;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle,#ffe566 60%,#ffaa00 100%);
  box-shadow:0 0 50px 20px #ffdd6688;
  transition:top 3s ease, left 3s ease, opacity 3s ease, transform 3s ease;
  pointer-events:none;z-index:1;
}

/* ── MOON ── */
#moon{
  position:absolute;width:55px;height:55px;border-radius:50%;
  background:radial-gradient(circle,#f0f0d0 60%,#c8c890 100%);
  box-shadow:0 0 25px 8px #f0f0c055;
  opacity:0;
  transition:top 3s ease, left 3s ease, opacity 3s ease;
  pointer-events:none;z-index:1;
}

/* ── STARS ── */
.star{
  position:absolute;border-radius:50%;background:#fff;
  pointer-events:none;z-index:0;
  animation:twinkle ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.2;transform:scale(.7)} to{opacity:1;transform:scale(1.2)}}

/* ── CLOUDS ── */
.cloud{position:absolute;z-index:2;pointer-events:none;}
.cloud-body{
  position:relative;height:50px;
  transition:opacity 3s ease;
}
.cloud-body span{
  display:block;background:rgba(255,255,255,0.92);
  border-radius:50%;position:absolute;
}
@keyframes cloudFloat{
  from{transform:translateX(-220px)}
  to{transform:translateX(110vw)}
}

/* ── BACKGROUND TREES ── */
.bg-tree{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center;z-index:3;}
.bg-tree .can{border-radius:50% 50% 40% 40%;position:relative;top:8px;}
.bg-tree .trk{background:#7a4f2a;border-radius:3px;}

/* ── LAKE ── */
#lake{
  position:absolute;bottom:52px;
  border-radius:50%;
  background:radial-gradient(ellipse at 30% 30%, #6ec6f0 0%, #3a8fc4 50%, #1a5f8a 100%);
  box-shadow:inset 0 -4px 12px #1a5f8a88, 0 2px 8px #3a8fc455;
  z-index:4;overflow:hidden;
  animation:lakeShimmer 3s ease-in-out infinite alternate;
}
@keyframes lakeShimmer{
  0%{box-shadow:inset 0 -4px 12px #1a5f8a88, 0 2px 8px #3a8fc455;}
  100%{box-shadow:inset 0 -4px 18px #1e6ea055, 0 2px 12px #5ab0e888;}
}
/* ripple lines on lake */
.lake-line{
  position:absolute;border-radius:50%;
  border:1px solid rgba(255,255,255,0.25);
  animation:rippleLoop 3s ease-in-out infinite;
}
@keyframes rippleLoop{
  0%,100%{transform:scale(1);opacity:.4}
  50%{transform:scale(1.04);opacity:.15}
}

/* ── CAVE ── */
#cave{
  position:absolute;bottom:48px;z-index:4;
}
#cave-mouth{
  width:90px;height:65px;
  background:radial-gradient(ellipse at 50% 100%, #1a1a1a 40%, #3a2a1a 100%);
  border-radius:50% 50% 0 0;
  position:relative;
  box-shadow:inset 0 10px 20px #0008;
}
#cave-rock{
  width:120px;height:30px;
  background:linear-gradient(180deg,#8a7a6a,#6a5a4a);
  border-radius:10px 10px 0 0;
  position:relative;top:2px;
}

/* ── GRASS ── */
.grass{position:absolute;bottom:48px;pointer-events:none;z-index:4;}

/* ── ANIMALS ── */
.animal{
  position:absolute;font-size:2rem;z-index:5;
  pointer-events:none;
  transition:bottom .8s ease, left .8s ease, opacity .6s ease;
}

/* ── RAIN ── */
#rain-layer{
  position:absolute;inset:0;pointer-events:none;z-index:20;
  display:none;
}
.raindrop{
  position:absolute;width:2px;
  background:linear-gradient(180deg,transparent,#aaddff);
  border-radius:2px;
  animation:fall linear infinite;
}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(110vh)}}

/* ── SEED / TREE ── */
#tree-container{
  position:absolute;bottom:48px;
  display:flex;flex-direction:column;align-items:center;
  z-index:6;
  transition:left .6s;
  cursor:default;
}
/* Ground / soil mound */
#soil{
  width:60px;height:18px;
  background:radial-gradient(ellipse,#8B5E3C 60%,#6b4422 100%);
  border-radius:50%;
  position:relative;z-index:1;
}
/* Seed stage */
#seed{
  width:16px;height:22px;
  background:radial-gradient(ellipse at 40% 30%,#d4a043 50%,#8B5E3C 100%);
  border-radius:50% 50% 40% 40%;
  position:absolute;bottom:10px;
  left:50%;transform:translateX(-50%);
  box-shadow:2px 3px 5px #0003;
  transition:opacity .8s;
  z-index:2;
}
/* Tree trunk */
#tree-trunk{
  background:#8B5E3C;border-radius:5px 5px 3px 3px;
  transition:width .7s ease,height .7s ease;
  position:relative;z-index:2;
}
/* Tree canopy */
#tree-canopy{
  border-radius:50% 50% 40% 40%;
  position:relative;top:6px;z-index:2;
  transition:width .7s ease,height .7s ease,background .7s ease;
  box-shadow:inset -6px -10px 0 #0002;
}
#tree-canopy::after{
  content:'';position:absolute;
  top:12%;left:18%;width:28%;height:28%;
  border-radius:50%;background:rgba(255,255,255,.18);
}
/* second canopy layer for big trees */
#tree-canopy2{
  border-radius:50% 50% 40% 40%;
  position:relative;z-index:2;top:14px;
  transition:width .7s ease,height .7s ease,background .7s ease,opacity .7s ease;
  opacity:0;
  box-shadow:inset -5px -8px 0 #0002;
}
@keyframes treeBounce{
  0%{transform:scale(1)} 30%{transform:scale(1.1)} 70%{transform:scale(.97)} 100%{transform:scale(1)}
}
.treeBounce{animation:treeBounce .55s ease forwards;}

/* ── BOWL (drag item) ── */
#bowl{
  position:fixed;
  width:52px;height:52px;
  font-size:2.5rem;line-height:52px;text-align:center;
  cursor:grab;z-index:100;
  user-select:none;
  filter:drop-shadow(2px 3px 4px #0004);
  transition:transform .15s;
  bottom:32px; left:50%;
  transform:translateX(-50%);
}
#bowl:hover{transform:translateX(-50%) scale(1.15);}
#bowl.dragging{cursor:grabbing;transform:scale(1.2);transition:none;}
#bowl.has-water{filter:drop-shadow(0 0 8px #4fc3f7);}
#bowl-hint{
  position:fixed;bottom:92px;left:50%;transform:translateX(-50%);
  background:#ffffffcc;backdrop-filter:blur(6px);border-radius:20px;
  padding:7px 18px;font-size:.85rem;color:#1a5276;font-weight:600;
  z-index:100;white-space:nowrap;
  transition:opacity .5s;
}

/* ── HUD ── */
#hud{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.78);backdrop-filter:blur(8px);
  border-radius:40px;padding:8px 26px;
  display:flex;gap:22px;align-items:center;
  box-shadow:0 4px 22px #0001;z-index:200;
  font-size:.88rem;color:#2e5a1c;font-weight:600;
  flex-wrap:wrap;justify-content:center;
}
#hud span b{font-size:1.1rem;color:#1b5e20;}

/* ── STAGE TOAST ── */
#toast{
  position:fixed;top:76px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#43a047,#1b5e20);
  color:#fff;border-radius:30px;padding:10px 28px;
  font-size:1rem;font-weight:700;
  box-shadow:0 6px 22px #2e7d3244;z-index:200;
  opacity:0;transition:opacity .4s;pointer-events:none;
  white-space:nowrap;
}

/* ── WATER TRAIL ── */
.water-drop{
  position:fixed;pointer-events:none;z-index:90;
  width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle,#6de0ff,#2196f3);
  animation:dropFade .6s ease forwards;
}
@keyframes dropFade{
  0%{opacity:.9;transform:scale(1)}
  100%{opacity:0;transform:scale(.2) translateY(10px)}
}

/* ── FLOATING +WATER ── */
.float-text{
  position:fixed;font-size:1.3rem;font-weight:800;
  color:#0288d1;pointer-events:none;z-index:200;
  animation:floatUp 1.2s ease forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-65px) scale(1.35)}
}

/* ── RAIN OVERLAY TEXT ── */
#rain-notice{
  position:fixed;top:76px;left:50%;transform:translateX(-50%);
  background:#1a4a6add;color:#fff;border-radius:20px;
  padding:8px 22px;font-size:.9rem;font-weight:700;
  z-index:200;opacity:0;transition:opacity .5s;pointer-events:none;
}

/* ── NIGHT OVERLAY ── */
#night-overlay{
  position:absolute;inset:0;z-index:1;
  background:rgba(0,0,30,.5);
  opacity:0;pointer-events:none;
  transition:opacity 3s ease;
}

/* ── CLOCK ── */
#clock{
  position:fixed;top:14px;right:22px;
  background:rgba(0,0,0,.35);backdrop-filter:blur(6px);
  color:#fff;border-radius:14px;padding:6px 14px;
  font-size:.9rem;font-weight:700;z-index:200;letter-spacing:.5px;
}

/* ── FEED LIMIT NOTICE ── */
#limit-notice{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:#e53935dd;color:#fff;border-radius:20px;
  padding:8px 22px;font-size:.9rem;font-weight:700;
  z-index:200;opacity:0;transition:opacity .5s;pointer-events:none;
}

/* ── WATER RIPPLE ON TREE ── */
.water-splash{
  position:fixed;pointer-events:none;z-index:150;
  font-size:1.4rem;
  animation:splash .8s ease forwards;
}
@keyframes splash{
  0%{opacity:1;transform:scale(.5)} 50%{opacity:1;transform:scale(1.4)} 100%{opacity:0;transform:scale(1.8)}
}

/* ── SCROLL TOOLTIP ── */
#sound-btn{
  position:fixed;bottom:32px;right:22px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(6px);
  border:none;border-radius:50%;width:44px;height:44px;
  font-size:1.3rem;cursor:pointer;z-index:200;
  box-shadow:0 3px 12px #0002;transition:transform .15s;
}
#sound-btn:hover{transform:scale(1.1);}
</style>
</head>
<body>

<div id="scene" class="sky-day">
  <div id="night-overlay"></div>
  <div id="sun"></div>
  <div id="moon"></div>
  <!-- Stars, clouds, trees, lake, cave, animals → injected by JS -->
  <div id="tree-container">
    <div id="tree-canopy2"></div>
    <div id="tree-canopy"></div>
    <div id="tree-trunk"></div>
    <div id="soil"><div id="seed"></div></div>
  </div>
  <div id="rain-layer"></div>
</div>

<!-- HUD -->
<div id="hud">
  <span>🌱 Stage: <b id="h-stage">Seed</b></span>
  <span>💧 Fed: <b id="h-fed">0</b></span>
  <span>🕐 Feeds left: <b id="h-left">4</b></span>
  <span>🌳 Growth: <b id="h-growth">0%</b></span>
</div>

<!-- Clock -->
<div id="clock">🌅 06:00</div>

<!-- Toasts / notices -->
<div id="toast">🎉 Tree leveled up!</div>
<div id="rain-notice">🌧️ It's raining! Animals take shelter.</div>
<div id="limit-notice">⏳ You can only water 4 times per 12 hours!</div>

<!-- Bowl hint -->
<div id="bowl-hint">🪣 Pick up the bowl → drag to lake → drag water to tree</div>
<!-- Bowl -->
<div id="bowl">🪣</div>

<!-- Sound toggle -->
<button id="sound-btn" title="Toggle sound">🔊</button>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   CONSTANTS & STATE
══════════════════════════════════════════════════════════════ */
const W = window.innerWidth, H = window.innerHeight;
const GROUND_Y = 48; // px from bottom → matches CSS bottom:48px

// Day/night: 7 real minutes = full 24h game day
const REAL_DAY_MS  = 7 * 60 * 1000;   // 7 min real = 24h game
const GAME_HOUR_MS = REAL_DAY_MS / 24; // 1 game hour in ms

// Rain every 2 game hours, lasts 1 game hour
const RAIN_INTERVAL_GAME_H = 2;
const RAIN_DURATION_GAME_H = 1;

// Feed limits
const MAX_FEEDS_PER_12H = 4;

// Tree growth stages
const STAGES = [
  { name:'Seed',       feeds:0,  cW:0,   cH:0,   c2W:0,  c2H:0,  tW:0,  tH:0,  col:'#4caf50', col2:'#388e3c' },
  { name:'Sprout',     feeds:1,  cW:40,  cH:44,  c2W:0,  c2H:0,  tW:8,  tH:22, col:'#81c784', col2:'#66bb6a' },
  { name:'Seedling',   feeds:3,  cW:62,  cH:68,  c2W:0,  c2H:0,  tW:12, tH:38, col:'#66bb6a', col2:'#4caf50' },
  { name:'Sapling',    feeds:7,  cW:88,  cH:95,  c2W:0,  c2H:0,  tW:16, tH:58, col:'#4caf50', col2:'#43a047' },
  { name:'Young Tree', feeds:13, cW:115, cH:125, c2W:0,  c2H:0,  tW:20, tH:80, col:'#43a047', col2:'#388e3c' },
  { name:'Tree',       feeds:22, cW:145, cH:155, c2W:90, c2H:100,tW:24, tH:105,col:'#388e3c', col2:'#2e7d32' },
  { name:'Tall Tree',  feeds:34, cW:175, cH:190, c2W:115,c2H:125,tW:30, tH:132,col:'#2e7d32', col2:'#1b5e20' },
  { name:'Grand Tree', feeds:50, cW:210, cH:225, c2W:140,c2H:150,tW:38, tH:162,col:'#1b5e20', col2:'#33691e' },
  { name:'Ancient Oak',feeds:70, cW:250, cH:265, c2W:170,c2H:180,tW:46, tH:195,col:'#33691e', col2:'#1b5e20' },
];

let state = {
  totalFeeds: 0,
  feedsThisWindow: 0,       // feeds in current 12h window
  windowStart: Date.now(),   // when current 12h window started
  stageIdx: 0,
  gameStartMs: Date.now(),
  bowlHasWater: false,
  isDragging: false,
  isRaining: false,
  isNight: false,
  soundOn: true,
  lastRainGameH: -1,
};

/* ══════════════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════════════ */
function el(id){ return document.getElementById(id); }

function showToast(msg, el_id='toast', dur=2800){
  const t = el(el_id);
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.style.opacity='0'; }, dur);
}

function currentGameHour(){
  const elapsed = Date.now() - state.gameStartMs;
  // 0–23
  return (elapsed / GAME_HOUR_MS) % 24;
}

function currentStage(){
  let s = STAGES[0];
  for(let i = STAGES.length-1; i>=0; i--){
    if(state.totalFeeds >= STAGES[i].feeds){ s=STAGES[i]; break; }
  }
  return s;
}

function stageIndex(){
  let idx=0;
  for(let i=STAGES.length-1;i>=0;i--){
    if(state.totalFeeds>=STAGES[i].feeds){idx=i;break;}
  }
  return idx;
}

function feedsLeft(){
  // Reset window every 12 game hours = 3.5 real minutes
  const half = REAL_DAY_MS / 2;
  if(Date.now() - state.windowStart >= half){
    state.feedsThisWindow = 0;
    state.windowStart = Date.now();
  }
  return MAX_FEEDS_PER_12H - state.feedsThisWindow;
}

/* ══════════════════════════════════════════════════════════════
   WEB AUDIO ENGINE
══════════════════════════════════════════════════════════════ */
let AC = null, masterGain;

// noise buffer for reuse
let noiseBuffer = null;

function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = AC.createGain();
  masterGain.gain.value = state.soundOn ? 1 : 0;
  masterGain.connect(AC.destination);
  makeNoiseBuffer();
  startBirds();
  startWind();
  // Start rain/cricket manager
  scheduleSounds();
}

function makeNoiseBuffer(){
  const sr = AC.sampleRate;
  noiseBuffer = AC.createBuffer(1, sr*4, sr);
  const d = noiseBuffer.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}

function createNoise(){
  const src = AC.createBufferSource();
  src.buffer = noiseBuffer;
  src.loop = true;
  return src;
}

/* ── WIND ── */
let windNodes = null;
function startWind(){
  const n = createNoise();
  const f = AC.createBiquadFilter();
  f.type='bandpass'; f.frequency.value=200; f.Q.value=.4;
  const g = AC.createGain(); g.gain.value=.04;
  const lfo = AC.createOscillator();
  const lfoG = AC.createGain(); lfoG.gain.value=.02;
  lfo.frequency.value=.12;
  lfo.connect(lfoG); lfoG.connect(g.gain);
  lfo.start();
  n.connect(f); f.connect(g); g.connect(masterGain);
  n.start();
  windNodes={n,f,g,lfo};
}

/* ── BIRDS (day) ── */
let birdTimer = null;
function startBirds(){
  function chirp(){
    if(!state.soundOn || state.isNight || state.isRaining) { birdTimer=setTimeout(chirp, 800+Math.random()*1200); return; }
    const freqs=[900,1100,1400,1700,2000,2200];
    const f0 = freqs[Math.floor(Math.random()*freqs.length)];
    const notes = Math.floor(2+Math.random()*4);
    let t = AC.currentTime;
    for(let i=0;i<notes;i++){
      const o = AC.createOscillator();
      const g = AC.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(f0*(1+i*.15), t+i*.08);
      o.frequency.exponentialRampToValueAtTime(f0*(1+i*.15)*1.2, t+i*.08+.06);
      g.gain.setValueAtTime(0, t+i*.08);
      g.gain.linearRampToValueAtTime(.08+Math.random()*.04, t+i*.08+.02);
      g.gain.exponentialRampToValueAtTime(.001, t+i*.08+.1);
      o.connect(g); g.connect(masterGain);
      o.start(t+i*.08); o.stop(t+i*.08+.15);
    }
    birdTimer = setTimeout(chirp, 400+Math.random()*1800);
  }
  chirp();
}

/* ── CRICKETS (night) ── */
let cricketTimer = null;
function startCrickets(){
  stopCrickets();
  function chip(){
    if(!state.soundOn || !state.isNight){ cricketTimer=setTimeout(chip,500); return; }
    const t = AC.currentTime;
    for(let i=0;i<3;i++){
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='square'; o.frequency.value=4200+Math.random()*200;
      g.gain.setValueAtTime(0,t+i*.03);
      g.gain.linearRampToValueAtTime(.025,t+i*.03+.005);
      g.gain.exponentialRampToValueAtTime(.001,t+i*.03+.04);
      o.connect(g); g.connect(masterGain);
      o.start(t+i*.03); o.stop(t+i*.03+.05);
    }
    cricketTimer=setTimeout(chip, 120+Math.random()*80);
  }
  chip();
}
function stopCrickets(){
  if(cricketTimer){ clearTimeout(cricketTimer); cricketTimer=null; }
}

/* ── RAIN ── */
let rainNodes=null;
function startRainSound(){
  if(rainNodes) return;
  const n=createNoise();
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800; f.Q.value=.3;
  const f2=AC.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=3000;
  const g=AC.createGain(); g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(.18,AC.currentTime+3);
  // occasional thunder rumble
  const n2=createNoise();
  const f3=AC.createBiquadFilter(); f3.type='lowpass'; f3.frequency.value=60;
  const g2=AC.createGain(); g2.gain.value=.09;
  n2.connect(f3); f3.connect(g2); g2.connect(masterGain);
  n.connect(f); f.connect(f2); f2.connect(g); g.connect(masterGain);
  n.start(); n2.start();
  rainNodes={n,f,f2,g,n2,f3,g2};
}
function stopRainSound(){
  if(!rainNodes) return;
  try{
    rainNodes.g.gain.linearRampToValueAtTime(0,AC.currentTime+2);
    setTimeout(()=>{
      try{rainNodes.n.stop();rainNodes.n2.stop();}catch(e){}
      rainNodes=null;
    },2100);
  }catch(e){rainNodes=null;}
}

/* ── WATER SPLASH (on feed) ── */
function playSplash(){
  if(!AC||!state.soundOn) return;
  const t=AC.currentTime;
  // drip
  const n=createNoise();
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=800; f.Q.value=2;
  const g=AC.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.3,t+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+.35);
  n.connect(f); f.connect(g); g.connect(masterGain);
  n.start(t); n.stop(t+.4);
  // plop
  for(let i=0;i<3;i++){
    const o=AC.createOscillator(),gp=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(300-i*60,t+i*.05);
    o.frequency.exponentialRampToValueAtTime(80,t+i*.05+.15);
    gp.gain.setValueAtTime(0,t+i*.05); gp.gain.linearRampToValueAtTime(.1,t+i*.05+.01);
    gp.gain.exponentialRampToValueAtTime(.001,t+i*.05+.18);
    o.connect(gp); gp.connect(masterGain);
    o.start(t+i*.05); o.stop(t+i*.05+.2);
  }
}

/* ── LEVEL UP CHIME ── */
function playLevelUp(){
  if(!AC||!state.soundOn) return;
  const freqs=[523,659,784,1047];
  freqs.forEach((f,i)=>{
    const t=AC.currentTime+i*.12;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.04);
    g.gain.exponentialRampToValueAtTime(.001,t+.35);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t+.4);
  });
}

══════════════════════════════════════════════════════════════ */
const sunEl=el('sun'), moonEl=el('moon'), overlay=el('night-overlay');
const clockEl=el('clock');

function setSkyForHour(gh){
  const s=scene;
  if(gh>=6&&gh<18){
    s.className='sky-day';
    overlay.style.opacity='0';
    setStars(false);
    moonEl.style.opacity='0';
    // sun position: arc from left to right
    const progress=(gh-6)/12; // 0→1
    const sx=W*0.05+W*0.9*progress;
    const sy=80 - Math.sin(progress*Math.PI)*( H*0.38);
    sunEl.style.left=sx+'px';
    sunEl.style.top=sy+'px';
    sunEl.style.opacity='1';
    // cloud brightness
    cloudEls.forEach(c=>{ const b=c.querySelector('.cloud-body'); if(b) b.style.background=''; });
    clockEl.style.background='rgba(0,0,0,.3)';
  } else if(gh>=18&&gh<20){
    s.className='sky-sunset';
    overlay.style.opacity='.1';
    setStars(false);
    moonEl.style.opacity='0';
    const p=(gh-18)/2;
    sunEl.style.left=(W*0.95-W*0.1*p)+'px';
    sunEl.style.top=(H*.55+H*.1*p)+'px';
    sunEl.style.opacity=(1-p*.8)+'';
    clockEl.style.background='rgba(80,20,0,.5)';
  } else {
    // night
    s.className='sky-night';
    overlay.style.opacity='.45';
    setStars(true);
    sunEl.style.opacity='0';
    moonEl.style.opacity='1';
    // moon arc
    const nh=gh>=20 ? gh-20 : gh+4; // 0–10 across night
    const np=nh/10;
    const mx=W*0.05+W*0.9*np;
    const my=80 - Math.sin(np*Math.PI)*(H*0.32);
    moonEl.style.left=mx+'px';
    moonEl.style.top=my+'px';
    // dim clouds
    cloudEls.forEach(c=>{ const b=c.querySelector('.cloud-body'); if(b) b.style.background='rgba(180,200,255,0.4)'; });
    clockEl.style.background='rgba(0,0,80,.6)';
  }
  // Format game clock display
  const hh=Math.floor(gh)%24;
  const mm=Math.floor((gh%1)*60);
  const ampm=hh>=12?'PM':'AM';
  const h12=hh%12||12;
  const icon=hh>=20||hh<6?'🌙':(hh>=18?'🌅':'☀️');
  clockEl.textContent=`${icon} ${String(h12).padStart(2,'0')}:${String(mm).padStart(2,'0')} ${ampm}`;
}

/* ══════════════════════════════════════════════════════════════
   RAIN CYCLE
══════════════════════════════════════════════════════════════ */
function checkRain(gh){
  // Rain on every even 2-hour mark, for 1 game hour
  const block=Math.floor(gh/RAIN_INTERVAL_GAME_H);
  const blockH=block*RAIN_INTERVAL_GAME_H;
  const withinRain=(gh-blockH)<RAIN_DURATION_GAME_H;

  if(withinRain&&!state.isRaining){
    state.isRaining=true;
    buildRain();
    startRainSound();
    hideAnimals();
    showToast('🌧️ It\'s raining! Animals run to the cave.','rain-notice',4000);
    // darken sky slightly
    overlay.style.opacity=state.isNight?'.55':'.15';
  } else if(!withinRain&&state.isRaining){
    state.isRaining=false;
    clearRain();
    stopRainSound();
    showAnimals();
    overlay.style.opacity=state.isNight?'.45':'0';
  }
}

/* ══════════════════════════════════════════════════════════════
   BOWL DRAG SYSTEM
══════════════════════════════════════════════════════════════ */
const bowlEl=el('bowl');
let drag={ active:false, startX:0, startY:0, curX:0, curY:0 };
let trailTimer=null;

// Get tree bounding box
function getTreeRect(){
  return treeContainer.getBoundingClientRect();
}
function getLakeRect(){
  return lakeDiv.getBoundingClientRect();
}

// Is point inside rect?
function ptInRect(x,y,r){ return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }

// Position bowl initially
function positionBowlDefault(){
  bowlEl.style.position='fixed';
  bowlEl.style.left=(W/2-26)+'px';
  bowlEl.style.bottom='32px';
  bowlEl.style.top='';
  bowlEl.style.transform='';
}
positionBowlDefault();

function onDragStart(e){
  if(!AC){ initAudio(); }
  e.preventDefault();
  const pt=getPoint(e);
  drag.active=true;
  drag.curX=pt.x-26; drag.curY=pt.y-26;
  bowlEl.style.left=drag.curX+'px';
  bowlEl.style.top=drag.curY+'px';
  bowlEl.style.bottom='';
  bowlEl.style.transform='scale(1.15)';
  bowlEl.classList.add('dragging');
  document.addEventListener('mousemove',onDragMove,{passive:false});
  document.addEventListener('touchmove',onDragMove,{passive:false});
  document.addEventListener('mouseup',onDragEnd);
  document.addEventListener('touchend',onDragEnd);
}

function onDragMove(e){
  if(!drag.active) return;
  e.preventDefault();
  const pt=getPoint(e);
  drag.curX=pt.x-26; drag.curY=pt.y-26;
  bowlEl.style.left=drag.curX+'px';
  bowlEl.style.top=drag.curY+'px';
  // water trail if bowl has water
  if(state.bowlHasWater){
    spawnWaterDrop(pt.x,pt.y);
  }
}

function onDragEnd(e){
  if(!drag.active) return;
  drag.active=false;
  bowlEl.classList.remove('dragging');
  const pt=getPoint(e);
  const lakeR=getLakeRect();
  const treeR=getTreeRect();

  if(!state.bowlHasWater){
    // Check if dropped on lake → fill bowl
    if(ptInRect(pt.x,pt.y,lakeR)){
      state.bowlHasWater=true;
      bowlEl.textContent='🪣';
      bowlEl.classList.add('has-water');
      bowlEl.style.filter='drop-shadow(0 0 10px #4fc3f7) drop-shadow(0 0 5px #0288d1)';
      bowlEl.style.fontSize='2.8rem';
      showToast('💧 Bowl filled with water! Now drag it to the tree.','toast',2200);
      el('bowl-hint').textContent='🌱 Drag the full bowl to your tree!';
    } else {
      positionBowlDefault();
    }
  } else {
    // Check if dropped on tree
    if(ptInRect(pt.x,pt.y,treeR)){
      feedTree(pt.x,pt.y);
    } else {
      positionBowlDefault();
    }
  }

  document.removeEventListener('mousemove',onDragMove);
  document.removeEventListener('touchmove',onDragMove);
  document.removeEventListener('mouseup',onDragEnd);
  document.removeEventListener('touchend',onDragEnd);
}

function getPoint(e){
  if(e.touches&&e.touches.length>0) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.changedTouches&&e.changedTouches.length>0) return {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  return {x:e.clientX,y:e.clientY};
}

function spawnWaterDrop(x,y){
  const d=document.createElement('div');
  d.className='water-drop';
  d.style.left=(x-4)+'px'; d.style.top=(y-4)+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),700);
}

bowlEl.addEventListener('mousedown',onDragStart);
bowlEl.addEventListener('touchstart',onDragStart,{passive:false});

/* ══════════════════════════════════════════════════════════════
   FEED TREE
══════════════════════════════════════════════════════════════ */
function feedTree(x,y){
  const fl=feedsLeft();
  if(fl<=0){
    showToast('⏳ Only 4 waters per 12 game-hours! Come back later.','limit-notice',3000);
    state.bowlHasWater=false;
    bowlEl.textContent='🪣';
    bowlEl.classList.remove('has-water');
    bowlEl.style.filter='';
    bowlEl.style.fontSize='2.5rem';
    positionBowlDefault();
    el('bowl-hint').textContent='🪣 Pick up the bowl → drag to lake → drag water to tree';
    return;
  }

  const prevStage=currentStage();
  state.totalFeeds++;
  state.feedsThisWindow++;

  const newStage=currentStage();
  applyStage(newStage);
  updateHUD();

  // splash effects
  playSplash();
  spawnSplash(x,y);
  spawnFloatText('💧 +1',x,y);

  // bounce
  treeContainer.classList.remove('treeBounce');
  void treeContainer.offsetWidth;
  treeContainer.classList.add('treeBounce');

  // level up?
  if(newStage.name!==prevStage.name){
    playLevelUp();
    showToast(`🎉 Your tree became a ${newStage.name}!`,'toast',3200);
  }

  // reset bowl
  state.bowlHasWater=false;
  bowlEl.textContent='🪣';
  bowlEl.classList.remove('has-water');
  bowlEl.style.filter='';
  bowlEl.style.fontSize='2.5rem';
  positionBowlDefault();
  el('bowl-hint').textContent='🪣 Pick up the bowl → drag to lake → drag water to tree';
}

/* ══════════════════════════════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════════════════════════════ */
let lastT=0;
function loop(t){
  const dt=t-lastT; lastT=t;
  const gh=currentGameHour();
  setSkyForHour(gh);
  checkRain(gh);
  walkAnimals(dt);
  updateHUD();
  requestAnimationFrame(loop);
}

// INIT
applyStage(STAGES[0]);
updateHUD();
requestAnimationFrame(loop);

// Start audio on first interaction (browser policy)
document.addEventListener('pointerdown',()=>{ if(!AC) initAudio(); },{once:true});

// Hint auto-fade
setTimeout(()=>{ el('bowl-hint').style.opacity='.55'; },6000);
</script>
